services:
  - type: web
    name: amns-safety-register
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: amns-safety-register-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
